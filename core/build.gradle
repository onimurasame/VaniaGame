sourceSets.main.java.srcDirs = ["src/com"]
sourceSets.test.java.srcDirs = ["src/test/kotlin"]

dependencies {
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-bullet:$gdxVersion"
    implementation "com.badlogicgames.box2dlights:box2dlights:$box2DLightsVersion"
    implementation "com.badlogicgames.gdx:gdx-tools:$gdxVersion"
    implementation "com.badlogicgames.ashley:ashley:$ashleyVersion"
    implementation "com.badlogicgames.gdx:gdx-ai:$aiVersion"
    implementation "net.dermetfan.libgdx-utils:libgdx-utils:0.13.4"
    implementation "net.dermetfan.libgdx-utils:libgdx-utils-box2d:0.13.4"
    implementation "com.github.czyzby:gdx-kiwi:1.9.1.9.6"
    implementation "com.kotcrab.vis:vis-ui:1.3.0"
    implementation "com.esotericsoftware.spine:spine-libgdx:3.6.53.1"

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.3"
    testImplementation "org.jetbrains.kotlin:kotlin-test:1.9.25"
}

eclipse.project {
    name = appName + "-core"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.register("replayTrace", JavaExec) {
    group = "verification"
    description = "Replay an input trace against deterministic simulation."
    mainClass = "com.onimurasame.vania.simulation.TraceReplayCli"
    classpath = sourceSets.main.runtimeClasspath
    doFirst {
        def tracePath = project.findProperty("traceFile")
        if (tracePath == null) {
            throw new GradleException("Provide trace path: ./gradlew :core:replayTrace -PtraceFile=build/traces/latest.trace")
        }
        args rootProject.file(tracePath).absolutePath
        def expectationPath = project.findProperty("expectationFile")
        if (expectationPath != null) {
            args rootProject.file(expectationPath).absolutePath
        }
    }
}

tasks.register("generateGoldenExpectation", JavaExec) {
    group = "verification"
    description = "Generate a golden expectation file from a replay trace."
    mainClass = "com.onimurasame.vania.simulation.TraceExpectationGeneratorCli"
    classpath = sourceSets.main.runtimeClasspath
    doFirst {
        def tracePath = project.findProperty("traceFile")
        if (tracePath == null) {
            throw new GradleException("Provide trace path: ./gradlew :core:generateGoldenExpectation -PtraceFile=build/traces/latest.trace")
        }
        def outputPath = project.findProperty("outputFile") ?: "build/traces/latest.expect"
        args rootProject.file(tracePath).absolutePath, rootProject.file(outputPath).absolutePath
    }
}

tasks.register("replayTraceBatch") {
    group = "verification"
    description = "Replay all trace files in a directory against matching expectation files."
    dependsOn tasks.named("classes")
    doLast {
        def tracesDirPath = project.findProperty("tracesDir") ?: "traces"
        def tracesDir = rootProject.file(tracesDirPath)
        if (!tracesDir.exists()) {
            throw new GradleException("Traces directory not found: ${tracesDir.absolutePath}")
        }

        def traceFiles = fileTree(tracesDir).matching { include "**/*.trace" }.files.sort()
        if (traceFiles.isEmpty()) {
            throw new GradleException("No .trace files found in ${tracesDir.absolutePath}")
        }

        traceFiles.each { traceFile ->
            def expectationFile = new File(traceFile.parentFile, traceFile.name.replace(".trace", ".expect"))
            if (!expectationFile.exists()) {
                throw new GradleException("Missing expectation for trace: ${traceFile.absolutePath}")
            }

            logger.lifecycle("Replaying ${traceFile.name} against ${expectationFile.name}")
            project.javaexec {
                mainClass = "com.onimurasame.vania.simulation.TraceReplayCli"
                classpath = sourceSets.main.runtimeClasspath
                args traceFile.absolutePath, expectationFile.absolutePath
            }
        }
    }
}

tasks.register("updateGoldenExpectations") {
    group = "verification"
    description = "Regenerate .expect files for all .trace files (requires -PallowGoldenWrite=true)."
    dependsOn tasks.named("classes")
    doLast {
        if (project.findProperty("allowGoldenWrite")?.toString() != "true") {
            throw new GradleException("Refusing to overwrite expectations. Re-run with -PallowGoldenWrite=true")
        }

        def tracesDirPath = project.findProperty("tracesDir") ?: "traces"
        def tracesDir = rootProject.file(tracesDirPath)
        if (!tracesDir.exists()) {
            throw new GradleException("Traces directory not found: ${tracesDir.absolutePath}")
        }

        def traceFiles = fileTree(tracesDir).matching { include "**/*.trace" }.files.sort()
        if (traceFiles.isEmpty()) {
            throw new GradleException("No .trace files found in ${tracesDir.absolutePath}")
        }

        traceFiles.each { traceFile ->
            def expectationFile = new File(traceFile.parentFile, traceFile.name.replace(".trace", ".expect"))
            logger.lifecycle("Generating ${expectationFile.name} from ${traceFile.name}")
            project.javaexec {
                mainClass = "com.onimurasame.vania.simulation.TraceExpectationGeneratorCli"
                classpath = sourceSets.main.runtimeClasspath
                args traceFile.absolutePath, expectationFile.absolutePath
            }
        }
    }
}
